apiVersion: 1

datasources:
  - name: PostgreSQL
    type: postgres
    uid: omnitrack-postgres
    url: db:5432
    database: omnitrack
    user: $POSTGRES_USER
    secureJsonData:
      password: $POSTGRES_PASSWORD
    jsonData:
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: false
    isDefault: true
    editable: true
